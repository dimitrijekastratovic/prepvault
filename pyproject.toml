[project]
name = "prepvault"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "bcrypt>=5.0.0",
    "fastapi>=0.138.0",
    "psycopg2-binary>=2.9.12",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "python-jose[cryptography]>=3.5.0",
    "sqlmodel>=0.0.38",
    "uvicorn>=0.49.0",
]

[dependency-groups]
dev = [
    "alembic>=1.18.4",
    "anyio>=4.14.0",
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-dotenv>=0.5.2",
    "respx>=0.23.1",
    "ruff>=0.15.18",
]

[tool.pytest.ini_options]
env_files = [".env.test"]
