[project]
name = "prepvault"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "bcrypt>=5.0.0",
    "fastapi>=0.139.0",
    "psycopg2-binary>=2.9.12",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "python-jose[cryptography]>=3.5.0",
    "sqlmodel>=0.0.39",
    "uvicorn>=0.50.2",
]

[dependency-groups]
dev = [
    "alembic>=1.18.5",
    "anyio>=4.14.1",
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-dotenv>=0.5.2",
    "respx>=0.23.1",
    "ruff>=0.15.20",
]

[tool.pytest.ini_options]
env_files = [".env.test"]
