name: Task
description: A discrete unit of work — feature, refactor, infra, or chore
title: "[Task] "
labels: ["task"]
body:
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Why does this exist? What problem does it solve? Link to ADR or related issues if applicable.
      placeholder: |
        e.g. Phase 5.6 requires a service abstraction layer for code execution. This
        ticket introduces the `CodeExecutionService` interface so we can swap providers
        without touching business logic.
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Specific, testable outcomes. Use checkboxes.
      value: |
        - [ ]
        - [ ] Tests written and passing
        - [ ] Docs / ADR updated if applicable
    validations:
      required: true

  - type: textarea
    id: out_of_scope
    attributes:
      label: Out of scope
      description: What is explicitly NOT in this ticket. Prevents scope creep.
      placeholder: |
        - Judge0 self-hosting setup (separate ticket)
        - Frontend wiring (separate ticket)
    validations:
      required: false

  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Implementation hints, gotchas, links to related issues or docs.
    validations:
      required: false
