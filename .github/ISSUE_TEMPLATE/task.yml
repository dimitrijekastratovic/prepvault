name: Task
description: A discrete unit of work — feature, refactor, infra, or chore
title: "[Task] "
labels: ["task"]
body:
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Why does this exist? What problem does it solve? Link to ADR or related issues if applicable.
      placeholder: |
        e.g. Phase 5.6 requires a service abstraction layer for code execution. This
        ticket introduces the `CodeExecutionService` interface so we can swap providers
        without touching business logic.
    validations:
      required: true

  - type: textarea
    id: work
    attributes:
      label: What needs to be done
      description: The concrete work for this ticket. A checklist or short prose.
      placeholder: |
        - Define `CodeExecutionService` protocol in `app/services/code_execution.py`
        - Implement `Judge0CodeExecutionService` against the existing Judge0 client
        - Wire the service into the submission router via FastAPI dependency injection
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: How we know it's done. Testable outcomes, not the work itself.
      value: |
        - [ ]
        - [ ] Tests written and passing
        - [ ] Docs / ADR updated if applicable
    validations:
      required: true