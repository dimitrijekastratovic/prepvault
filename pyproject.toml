[project]
name = "prepvault"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "bcrypt>=5.0.0",
    "fastapi>=0.141.1",
    "psycopg2-binary>=2.9.12",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "python-jose[cryptography]>=3.5.0",
    "sqlmodel>=0.0.42",
    "uvicorn>=0.52.4",
]

[dependency-groups]
dev = [
    "alembic>=1.19.1",
    "anyio>=4.15.0",
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-dotenv>=0.5.2",
    "respx>=0.23.1",
    "ruff>=0.16.6",
]

[tool.pytest.ini_options]
env_files = [".env.test"]
