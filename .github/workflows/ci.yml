name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - name: Install dependencies
        # --frozen ensures CI uses the exact versions in uv.lock; fails if the lock is stale.
        run: uv sync --frozen

      - name: Run ruff
        run: uv run ruff check .

      - name: Run tests
        run: uv run pytest

      - name: Build Docker image
        run: docker build -t prepvault .
