name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    # Postgres service for the test suite. The runner reaches it at localhost:5432.
    # Credentials and database name only need to exist for the duration of the job;
    # they are not secrets.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: prepvault
          POSTGRES_PASSWORD: prepvault
          POSTGRES_DB: prepvault_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U prepvault -d prepvault_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3  # v8.3.0
        with:
          enable-cache: true

      - name: Install dependencies
        # --frozen ensures CI uses the exact versions in uv.lock; fails if the lock is stale.
        run: uv sync --frozen

      - name: Run ruff
        run: uv run ruff check .

      - name: Run tests
        env:
          TEST_DATABASE_URL: postgresql://prepvault:prepvault@localhost:5432/prepvault_test
        run: uv run pytest

      - name: Build Docker image
        run: docker build -t prepvault .
